<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Color Trick — Daily Games</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html" style="color:inherit;text-decoration:none;">← Daily Games</a>
    <div class="controls">
      <a href="about.html" class="topbar-link">About</a>
      <button id="soundToggle" class="icon-btn" aria-label="Toggle sound">🔇</button>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main class="container">
    <div class="center-text">
      <h1>🎨 Color Trick</h1>
      <p class="tagline">Trust your eyes, not your mind.</p>
      <p class="puzzle-num" id="puzzleNum"></p>
    </div>

    <!-- Round progress -->
    <div class="strooply-progress">
      <div class="strooply-progress-label">Round <span id="roundNum">1</span> of 10</div>
      <div class="strooply-progress-bar"><div id="roundsBar"></div></div>
    </div>

    <!-- Question above the word -->
    <p class="strooply-question">Tap the color the text is <em>painted in</em>.</p>

    <!-- Stage: timer ring + colored word -->
    <div class="strooply-stage" id="stage">
      <svg class="strooply-ring" viewBox="0 0 280 280" aria-hidden="true">
        <circle class="ring-track"    cx="140" cy="140" r="130"></circle>
        <circle class="ring-progress" cx="140" cy="140" r="130" id="ringCircle"></circle>
      </svg>
      <div class="strooply-word strooply-start" id="word" role="button" tabindex="0">START</div>
    </div>

    <!-- 4 color buttons (no text, color only — works in any language) -->
    <div class="strooply-options" id="options">
      <button class="strooply-btn" data-name="RED"    style="background:#E74C3C" aria-label="Red"    disabled></button>
      <button class="strooply-btn" data-name="BLUE"   style="background:#3498DB" aria-label="Blue"   disabled></button>
      <button class="strooply-btn" data-name="GREEN"  style="background:#27AE60" aria-label="Green"  disabled></button>
      <button class="strooply-btn" data-name="YELLOW" style="background:#F1C40F" aria-label="Yellow" disabled></button>
    </div>

    <!-- Result panel — hidden until the day's 10 rounds finish -->
    <div id="resultPanel" class="result" style="display:none;">
      <h3 id="resultTitle"></h3>
      <div id="bestBadge" class="best-badge" style="display:none;">★ New personal best!</div>
      <div id="resultGrid" class="emoji-grid"></div>
      <div id="resultText"></div>
      <div class="stats-mini" id="statsMini"></div>
      <div style="margin-top:14px;">
        <button id="shareBtn" class="btn">Share</button>
        <a href="index.html" class="btn secondary">Home</a>
      </div>
      <div style="margin-top:14px;">Next puzzle in <span class="countdown" id="cd">--:--:--</span></div>
    </div>
  </main>

  <footer>
    <a href="index.html">Home</a> ·
    <a href="about.html">About</a> ·
    <a href="privacy.html">Privacy</a> ·
    <a href="terms.html">Terms</a> ·
    <a href="#" onclick="openConsentSettings();return false;">Cookie Settings</a>
    <div style="margin-top:6px;">
      <a href="#" onclick="openConsentSettings();return false;">Do Not Sell or Share My Personal Information</a>
    </div>
  </footer>

  <script src="js/shared.js?v=2"></script>
  <script src="js/color-trick.js?v=2"></script>
</body>
</html>
