<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Daily Maze — Daily Games</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html" style="color:inherit;text-decoration:none;">← Daily Games</a>
    <div class="controls">
      <a href="about.html" class="topbar-link">About</a>
      <button id="soundToggle" class="icon-btn" aria-label="Toggle sound">🔇</button>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main class="container">
    <div class="center-text">
      <h1>🧩 Daily Maze</h1>
      <p class="tagline">Find the exit. Use arrow keys, the on-screen buttons, or swipe.</p>
      <p class="puzzle-num" id="puzzleNum"></p>
    </div>

    <div class="maze-wrap">
      <canvas id="mazeCanvas" width="380" height="380" aria-label="Daily maze"></canvas>
    </div>
    <div class="maze-status">Moves: <span id="moveCount">0</span></div>

    <!-- On-screen D-pad for phones -->
    <div class="maze-controls">
      <span class="spacer"></span>
      <button class="btn" data-dir="up">↑</button>
      <span class="spacer"></span>
      <button class="btn" data-dir="left">←</button>
      <button class="btn" data-dir="down">↓</button>
      <button class="btn" data-dir="right">→</button>
    </div>

    <div id="resultPanel" class="result" style="display:none;">
      <h3 id="resultTitle"></h3>
      <div id="resultText"></div>
      <div class="stats-mini" id="statsMini"></div>
      <div style="margin-top:14px;">
        <button id="shareBtn" class="btn">Share</button>
        <a href="index.html" class="btn secondary">Home</a>
      </div>
      <div style="margin-top:14px;">Next puzzle in <span class="countdown" id="cd">--:--:--</span></div>
    </div>
  </main>

  <footer>
    <a href="index.html">Home</a> ·
    <a href="about.html">About</a> ·
    <a href="privacy.html">Privacy</a> ·
    <a href="terms.html">Terms</a> ·
    <a href="#" onclick="openConsentSettings();return false;">Cookie Settings</a>
    <div style="margin-top:6px;">
      <a href="#" onclick="openConsentSettings();return false;">Do Not Sell or Share My Personal Information</a>
    </div>
  </footer>

  <script src="js/shared.js?v=2"></script>
  <script src="js/daily-maze.js?v=2"></script>
</body>
</html>
