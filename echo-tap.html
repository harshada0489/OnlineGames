<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Echo Tap — Daily Games</title>
  <meta name="description" content="Watch the colour sequence, then repeat it back. A calm memory game." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="canonical" href="https://puzzleminute.com/echo-tap.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Daily Games" />
  <meta property="og:url" content="https://puzzleminute.com/echo-tap.html" />
  <meta property="og:title" content="Echo Tap" />
  <meta property="og:description" content="Watch the colour sequence, then repeat it back. A calm memory game." />
  <meta property="og:image" content="https://puzzleminute.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html" style="color:inherit;text-decoration:none;">← Daily Games</a>
    <div class="controls">
      <a href="about.html" class="topbar-link">About</a>
      <button id="soundToggle" class="icon-btn" aria-label="Toggle sound">🔇</button>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">☾</button>
    </div>
  </header>

  <main class="container">
    <div class="center-text">
      <h1>🎵 Echo Tap</h1>
      <p class="tagline">Watch the sequence, then tap it back. Each round adds one step.</p>
      <p class="puzzle-num" id="puzzleNum"></p>
    </div>

    <div class="seq-level">Level <span id="level">1</span></div>
    <div class="seq-status" id="status">Tap Start to begin</div>

    <div class="seq-pads" id="pads">
      <button class="seq-pad red"    data-i="0" disabled></button>
      <button class="seq-pad blue"   data-i="1" disabled></button>
      <button class="seq-pad green"  data-i="2" disabled></button>
      <button class="seq-pad yellow" data-i="3" disabled></button>
    </div>

    <div class="center-text">
      <button id="startBtn" class="btn">Start</button>
    </div>

    <div id="resultPanel" class="result" style="display:none;">
      <h3 id="resultTitle"></h3>
      <div id="resultText"></div>
      <div class="stats-mini" id="statsMini"></div>
      <div style="margin-top:14px;">
        <button id="shareBtn" class="btn">Share</button>
        <a href="index.html" class="btn secondary">Home</a>
      </div>
      <div style="margin-top:14px;">Next puzzle in <span class="countdown" id="cd">--:--:--</span></div>
    </div>
  </main>

  <footer>
    <a href="index.html">Home</a> ·
    <a href="about.html">About</a> ·
    <a href="privacy.html">Privacy</a> ·
    <a href="terms.html">Terms</a> ·
    <a href="#" onclick="openConsentSettings();return false;">Cookie Settings</a>
    <div style="margin-top:6px;">
      <a href="#" onclick="openConsentSettings();return false;">Do Not Sell or Share My Personal Information</a>
    </div>
  </footer>

  <script src="js/shared.js?v=2"></script>
  <script src="js/echo-tap.js?v=2"></script>
</body>
</html>
