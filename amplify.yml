# AWS Amplify Hosting build specification.
# Pure static site — no build step, no install step.
# Publish every file in the repo root as-is.
version: 1
frontend:
  phases:
    preBuild:
      commands: []
    build:
      commands: []
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
